services:
  cowrie:
    container_name: cowrie
    restart: unless-stopped

    build:
      context: ..
      dockerfile: docker/Dockerfile

    image: cowrie-local:latest

    ports:
      - "0.0.0.0:22:2222/tcp"

    environment:
      COWRIE_TELNET_ENABLED: "false"

    volumes:
      - cowrie-etc:/cowrie/cowrie-git/etc:ro
      - cowrie-var:/cowrie/cowrie-git/var:rw

    user: "999:999"

    cap_drop:
      - ALL

    read_only: true

    security_opt:
      - no-new-privileges:true

    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m

    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128

    networks:
      - honeypot

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  honeypot:
    name: honeypot-net
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-honeypot

volumes:
  cowrie-etc:
  cowrie-var:
